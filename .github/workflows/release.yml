name: Release P-UI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "p-ui.service.debian"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "p-ui.service.debian"
      - ".github/workflows/release.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform hitting a transient outage must not cancel the other six.
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build P-UI
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          SINGBOX_VER="v1.14.0"
          # 403 is in the retry list because that is what the release CDN answers
          # when seven matrix legs pull the same assets at once; -nv keeps the URL
          # and status in the log, where -q left only wget's bare exit 8.
          fetch() { wget -nv --tries=5 --waitretry=10 --retry-on-http-error=403,408,429,500,502,503 "$@"; }
          # Pure Go, no cgo: the panel has no C dependency left, so every target
          # cross-compiles straight from the runner's toolchain and links
          # statically without an external linker or a downloaded cross-gcc.
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            armv7) export GOARCH=arm GOARM=7 ;;
            armv6) export GOARCH=arm GOARM=6 ;;
            armv5) export GOARCH=arm GOARM=5 ;;
          esac
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          # The XTLS asset suffix for this platform. GOARCH cannot answer it —
          # 32-bit ARM is always "arm" and GOARM carries the level — and guessing
          # is unsafe: a v7a binary SIGILLs on ARMv5 (RUNTIME-RESULTS §16).
          case "${{ matrix.platform }}" in
            amd64) ASSET_ARCH=64 ;;
            arm64) ASSET_ARCH=arm64-v8a ;;
            armv7) ASSET_ARCH=arm32-v7a ;;
            armv6) ASSET_ARCH=arm32-v6 ;;
            armv5) ASSET_ARCH=arm32-v5 ;;
            386) ASSET_ARCH=32 ;;
            *) ASSET_ARCH="${{ matrix.platform }}" ;;
          esac
          LDFLAGS="-w -s -X github.com/Arman2122/p-ui/internal/xray.releaseAssetArch=${ASSET_ARCH}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/Arman2122/p-ui/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/Arman2122/p-ui/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -ldflags "$LDFLAGS" -o pui-release -v main.go
          file pui-release

          mkdir p-ui
          cp pui-release p-ui/
          cp p-ui.service.debian p-ui/
          cp p-ui.sh p-ui/
          # AmneziaWG ships as SOURCE, not a binary: a kernel module is bound to the
          # kernel it was compiled against, so the host builds it with DKMS. The
          # same payload for every architecture, being C rather than a build.
          cp awg-dkms.sh p-ui/
          mkdir -p p-ui/amneziawg
          cp -a third_party/amneziawg-kernel/. p-ui/amneziawg/
          mv p-ui/pui-release p-ui/p-ui
          mkdir p-ui/bin
          cd p-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.7.28/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            fetch ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v7a.zip
            unzip Xray-linux-arm32-v7a.zip
            rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v6.zip
            unzip Xray-linux-arm32-v6.zip
            rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "386" ]; then
            fetch ${Xray_URL}Xray-linux-32.zip
            unzip Xray-linux-32.zip
            rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v5.zip
            unzip Xray-linux-arm32-v5.zip
            rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            fetch ${Xray_URL}Xray-linux-s390x.zip
            unzip Xray-linux-s390x.zip
            rm -f Xray-linux-s390x.zip
          fi
          rm -f geoip.dat geosite.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}
          # mtg-proxy (MTProto sidecar) ships prebuilt release binaries whose
          # platform labels match our matrix, so download and unpack the matching
          # archive. Only the platforms it publishes are packaged — the tag
          # lookup lives inside that branch so unpackaged platforms (s390x) never
          # depend on it. The tag comes from the release-page redirect on
          # github.com — the host the downloads need anyway — because api.github.com
          # has 503'd whole release runs while asset downloads kept working.
          # The binary keeps the name `mtg-linux-<platform>` on our side:
          # internal/mtproto resolves it by that name and renaming it here would
          # be a second change for no gain.
          case "${{ matrix.platform }}" in
            amd64|arm64|armv7|armv6|386)
              MTG_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/Arman2122/mtg-proxy/releases/latest" | sed -n 's#.*/releases/tag/##p')
              if [ -z "$MTG_VER" ]; then echo "could not resolve the latest mtg-proxy release tag"; exit 1; fi
              MTG_PKG="mtg-proxy-${MTG_VER#v}-linux-${{ matrix.platform }}"
              curl -sfLRO $CURL_RETRY "https://github.com/Arman2122/mtg-proxy/releases/download/${MTG_VER}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-proxy" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          # sing-box is compiled from upstream's tagged source, not downloaded:
          # the published binary omits the v2ray_api service the panel bills
          # per-user traffic from, and that is one build tag, not a fork. The
          # module proxy plus the checksum database verify the source; GOARCH
          # and GOARM are already exported above, so this leg cross-compiles the
          # same way the panel does. internal/arch pins SINGBOX_VER to the
          # version the sing-box core expects. Named by GOARCH like mtg, so the
          # panel resolves it without an installer rename.
          # No GOBIN: go refuses to install a cross-compiled binary with it set.
          # A native build lands in GOPATH/bin, a cross build in bin/linux_<arch>.
          go install -trimpath \
            -tags with_v2ray_api,with_quic,with_utls,with_clash_api,with_acme \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VER#v}" \
            "github.com/sagernet/sing-box/cmd/sing-box@${SINGBOX_VER}"
          mv "$(find "$(go env GOPATH)/bin" -type f -name sing-box | head -1)" "sing-box-linux-${GOARCH}"
          cd ../..

      - name: Package
        run: tar -zcvf p-ui-linux-${{ matrix.platform }}.tar.gz p-ui

      # One digest beside each archive. install.sh and update.sh refuse to
      # extract an archive whose digest they cannot fetch and match, so a
      # truncated download or a tampered CDN object stops here instead of
      # becoming a root-owned binary. F277.
      - name: Checksum
        run: sha256sum p-ui-linux-${{ matrix.platform }}.tar.gz > p-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: p-ui-linux-${{ matrix.platform }}
          path: |
            ./p-ui-linux-${{ matrix.platform }}.tar.gz
            ./p-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      # `prerelease: true` is a CREATE-time staging state, not the final one: the
      # release does not exist when the tag is pushed, so whichever matrix leg
      # gets here first creates it while the other six are still uploading their
      # archives. Keeping it out of `releases/latest` for that window stops the
      # installer from resolving a tag whose asset for the caller's architecture
      # is not there yet. The `promote-release` job below flips it to the real
      # latest release once every platform has uploaded — it is load-bearing, the
      # tag would otherwise stay a pre-release forever and every default install
      # path would 404 (see that job's comment).
      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: p-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: p-ui-linux-${{ matrix.platform }}.tar.gz
          overwrite: true
          prerelease: true

      - name: Upload checksum to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: p-ui-linux-${{ matrix.platform }}.tar.gz.sha256
          asset_name: p-ui-linux-${{ matrix.platform }}.tar.gz.sha256
          overwrite: true
          prerelease: true

      # The updater ships WITH the release it installs. The panel and p-ui.sh
      # used to run whatever update.sh the tip of main carried, as root, on
      # every host -- so a commit on main was code execution everywhere.
      # Published from one leg: the script is not per-platform. F277.
      - name: Upload update.sh to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.platform == 'amd64'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: update.sh
          asset_name: update.sh
          overwrite: true
          prerelease: true

  # =====================================
  #  Promote the tagged release to latest
  # =====================================
  # GitHub's `/releases/latest` endpoint skips drafts and pre-releases, and that
  # endpoint is what every *default* path resolves: `install.sh` with no argument
  # (the headline command in the READMEs and the docs), `update.sh` — which backs
  # both `p-ui update` and the in-panel Update button — and the panel's stable
  # update channel (fetchPanelRelease("")). While the tag release is still marked
  # pre-release those all fail: empty tag_version, "Failed to fetch p-ui version",
  # HTTP 404. So the staged pre-release from the build job must be promoted here,
  # after all seven platform archives are uploaded (`needs: [build]` with
  # fail-fast disabled only succeeds when every leg did).
  # Re-running a single matrix leg later cannot undo this: upload-release-action
  # only applies `prerelease` when it has to create the release.
  promote-release:
    name: Promote tagged release to latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark tagged release as the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh takes the repo from the environment.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if gh release edit "${TAG}" --draft=false --prerelease=false --latest; then
              exit 0
            fi
            echo "attempt $i to promote ${TAG} failed" >&2
            sleep $((i * 5))
          done
          echo "could not promote ${TAG}: it stays a pre-release, so releases/latest keeps returning 404 and the default install/update commands stay broken" >&2
          exit 1

  # =================================
  #  Rolling dev channel (per-commit)
  # =================================
  # Publishes/overwrites the build artifacts to a single fixed-tag pre-release
  # `dev-latest`, force-moved to the new commit on every push to main. The panel's
  # "Dev" update channel installs from this tag. `--latest=false` is load-bearing:
  # it keeps releases/latest pointing at the real stable tag, so the stable
  # channel is unaffected.
  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload, or the dev
    # release could be left with a partial asset set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build — installs via the panel's Dev update channel.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          # The release exists on every run but the first; edit-first avoids an
          # existence probe that can 503 and mis-route into create (422).
          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          # Digests and the updater ride along, so the dev channel is verified
          # and tag-pinned exactly as a stable release is.
          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 update.sh --clobber
