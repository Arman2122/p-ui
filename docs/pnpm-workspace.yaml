allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Keep nested CSS processors and image decoders on patched compatible releases.
overrides:
  'postcss@<8.5.23': '^8.5.23'
  'sharp@<0.35.4': '^0.35.4'
  'brace-expansion@>=5 <5.0.9': '5.0.9'
minimumReleaseAgeExclude:
  - '@mermaid-js/parser@1.2.0'
  - mermaid@11.16.0
